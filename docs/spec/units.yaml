- id: U-4
  title: 'API: POST /api/tasks/{id}/done (mark done)'
  track: backend
  description: "Implement `POST /api/tasks/{id}/done` (no body; `id` maxLength 64). Returns `200 Task` with status 'done' for an open task and also for an already-done one (no change). An unknown, malformed or forged id returns `404 { error: 'not_found', message: 'task not found' }`, and no task changes. API tests use `app.inject`, including that the task no longer appears in `GET /api/tasks`."
  acs:
