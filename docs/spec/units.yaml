- id: U-3
  title: 'API: GET /api/tasks (list open tasks)'
  track: backend
  description: 'Implement `GET /api/tasks`, returning `200 { tasks: Task[] }` with only open tasks, in service sort order, and `tasks: []` when there are none. The response matches the `TaskList` schema (internal `seq` not exposed). API tests use `app.inject` and seed tasks through `POST /api/tasks`.'
