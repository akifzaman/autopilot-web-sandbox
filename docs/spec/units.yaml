- id: U-6
  title: Add-task form
  track: frontend
  description: "`AddTaskForm` on the Tasks screen, following `docs/design/tasks/`: title text input, optional `<input type=\"date\">` and a submit button. It calls **POST /api/tasks** with `{ title, dueDate? }`, omitting dueDate when empty. On 201 it clears the inputs and re-fetches **GET /api/tasks**, so the task appears in its sorted position. On 400 `validation_failed` it shows each `errors[].message` next to its field (`title` / `dueDate`) and keeps the entered values. Nothing is added to the list. The client doesn't duplicate validation rules; the server is the source of truth. Component tests (with the API mocked) and E2E."
