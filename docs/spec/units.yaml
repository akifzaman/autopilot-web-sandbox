- id: U-7
  title: Mark task done from the list
  track: frontend
  description: A Mark done button on each `OpenTaskList` row, with the task title in its accessible name. It calls **POST /api/tasks/{id}/done**. On 200, it removes the task from the local list without re-sorting, so the remaining order is unchanged. On 404 (a stale task already gone), it removes the row and shows a short 'Task not found' notice. The button is disabled while its request is in flight, to avoid double submits. If the list becomes empty, the 'No open tasks' state appears. Component tests and E2E.
