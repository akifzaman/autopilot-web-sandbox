  - U-3
- id: U-5
  title: 'Tasks screen: open-tasks list with empty state'
  track: frontend
  description: "Replace the scaffold content of `App` with `TasksScreen`, following the approved design in `docs/design/tasks/`. Add the typed API client `packages/web/src/api/tasks.ts`. On load, call **GET /api/tasks** and render `OpenTaskList` in server order: title as a plain text node and the due date, or nothing when there is none. When the list is empty, show the 'No open tasks' message instead of a list or table. Show loading and load-error states. Component tests next to the components, and Playwright E2E. Update `e2e/smoke.spec.ts` if the scaffold heading or API-status line changes (see questions)."
