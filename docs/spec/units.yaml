- id: U-2
  title: 'API: POST /api/tasks (add a task)'
  track: backend
  description: 'Register `routes/tasks.ts` under `/api` in `buildApp()`. Add a `store?: TaskStore` option to `AppOptions` (default: new InMemoryTaskStore per app) and set `bodyLimit` to 16 KiB. Implement `POST /api/tasks` exactly as in openapi.yaml: a JSON schema for `CreateTaskRequest` (additionalProperties false). Schema failures return `400 invalid_request`. Business validation failures return `400 validation_failed` with `errors[]`. Success returns `201 Task`. Add a custom Fastify error handler so all 400/415/500 bodies match the contract. API tests use `app.inject`.'
