stack: TypeScript (strict), Node.js, Fastify 5 API with @fastify/static, React 19 + Vite front-end, Vitest (API via app.inject, web via Testing Library/jsdom), Playwright E2E; in-memory task store behind a TaskStore interface; no new runtime dependencies.
units:
- id: U-1
  title: 'Task domain: validation, sorting and in-memory store'
  track: backend
  description: "Add `packages/api/src/tasks/`:\n- `validation.ts`: trim the title, then return `title_required` if it is empty or `title_too_long` if it is over 200 code points. Check `dueDate` with a strict `^\\d{4}-\\d{2}-\\d{2}$` regex plus a `Date.UTC` round-trip (leap years included) and return `invalid_due_date` if it fails. Omitted, null or '' means no date. All field errors are collected.\n- `store.ts`: `TaskStore` interface and `InMemoryTaskStore` (Map, `crypto.randomUUID()`, `createdAt`, monotonic `seq`).\n- `service.ts`: `createTask`, `listOpenTasks` (filter open, then sort with `compareOpenTasks`: dueDate ascending, null last, seq ascending), `markDone` (idempotent, not-found result).\nUnit tests with Vitest, no HTTP."
